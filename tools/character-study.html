<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>墨刃 · 原画还原检视</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#181a1b;color:#e9e3d7;font:13px "Songti SC",Georgia,serif}button,select,input{font:inherit}button,select{background:transparent;border:1px solid #ffffff25;color:inherit;padding:9px 13px;cursor:pointer}button:hover{border-color:#b9aa93}button.on{background:#e9e3d7;color:#222}select{background:#232526}a{color:inherit;text-decoration:none}header{padding:25px 30px 21px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff18}h1{font-size:20px;font-weight:400;letter-spacing:.15em;margin:0}h1 small{font:9px Georgia;letter-spacing:.23em;color:#9f9d95;display:block;margin-top:8px}.seal{display:inline-block;background:#88392c;border:1px solid #b86d50;padding:7px 9px;margin-right:14px}header a{font-size:12px;color:#bab7af}.controls{padding:19px 30px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}.rule{height:22px;width:1px;background:#ffffff20;margin:0 6px}.views{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#ffffff13;margin:0 30px;border:1px solid #ffffff13}.panel{position:relative;background:#242627;min-width:0}.panel-label{position:absolute;left:20px;top:19px;font-size:12px;letter-spacing:.2em;z-index:2}.panel-label small{display:block;font:9px Georgia;color:#96978f;letter-spacing:.12em;margin-top:7px}.panel canvas{display:block;width:100%;height:min(65vh,730px);min-height:370px}.badge{position:absolute;right:17px;top:18px;border:1px solid #b09b733f;color:#c5b597;font-size:10px;padding:4px 7px}.timeline{display:flex;align-items:center;gap:16px;padding:20px 30px 10px}.timeline input{accent-color:#ac503a;flex:1;min-width:60px}.timeline output{font:11px Georgia;width:50px;color:#b8b4a9}#timing{min-width:55px;color:#c6bba6;font-size:12px}footer{padding:13px 30px 25px;display:flex;justify-content:space-between;gap:20px;font-size:11px;line-height:1.8;color:#98988e}.warning{color:#d79777}#loading{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#d7cdbb}#error{color:#f0a58e;margin:20px 30px}[hidden]{display:none!important}@media(max-width:700px){header{padding:20px}h1{font-size:16px}.controls{padding:16px 20px;gap:6px}button,select{font-size:11px;padding:7px 9px}.views{margin:0 20px}.panel-label{left:12px;top:14px;font-size:11px}.badge{display:none}.panel canvas{height:54vh;min-height:340px}.timeline{padding:16px 20px 6px;gap:8px}footer{padding:12px 20px;display:block;font-size:10px}}
</style></head><body>
<style>.views.action{grid-template-columns:1fr}.views.action .panel:first-child{display:none}</style>
<header><h1><span class="seal">刃</span>原画还原检视<small>INK BLADE / ORIGINAL ART STUDY</small></h1><a href="../">进入竹林 ⟶</a></header>
<div class="controls">
  <select id="subject" aria-label="检视人物"><option value="player">墨衣 · 主角</option><option value="boss">白袍 · 剑客</option></select>
  <select id="view" aria-label="原画视角"><option value="front">正面</option><option value="side">侧面</option><option value="back">背面</option></select>
  <span class="rule"></span>
  <button data-state="reference" class="on">原画立姿</button><button data-state="idle">持刀</button><button data-state="run" data-speed="2.2">行走</button><button data-state="run" data-speed="7.4">奔跑</button><button data-state="attack">出刀</button><button data-state="guard">弹反</button><button data-state="dash">冲刺</button><button data-state="jump">跃起</button>
  <select id="move" aria-label="检视招式"><option value="slash1">一斩 · 横切</option><option value="slash2">二斩 · 反撩</option><option value="slash3">三斩 · 重劈</option><option value="upper">挑空</option><option value="air">空中斩</option><option value="dive">下劈</option></select>
</div>
<div class="views">
  <section class="panel"><div class="panel-label">你的原图<small id="file-name">HERO / FRONT</small></div><canvas id="source" aria-label="用户提供的原画"></canvas></section>
  <section class="panel"><div class="panel-label">游戏中的角色<small>同一张原图 · 无重绘</small></div><span class="badge">原始纹理</span><canvas id="render" aria-label="原画角色动作检视"></canvas><span id="loading">载入原画…</span></section>
</div>
<div class="timeline"><button id="pause">定格</button><select id="playback" aria-label="播放速度"><option value="1">正常速度</option><option value="0.25">¼ 慢放</option><option value="0.1">⅒ 慢放</option></select><input id="time" type="range" min="0" max="1000" step="1" value="0" aria-label="动作时间毫秒"><output id="ms">0 ms</output><button id="impact">命中帧</button><span id="timing">原画立姿</span></div>
<footer><span>脸、服饰和武器直接取自原图。动作由分层骨架驱动，实战使用同一套渲染。<br>正面、侧面、背面分别使用对应原图；动作检视使用侧面。</span><a id="reference" target="_blank">打开原始 PNG ↗</a></footer><p id="error" role="alert" hidden></p>
<script type="module">
import * as THREE from '../vendor/three.module.js';
import {ArtWarrior} from '../src/art-warrior.js';
import {ART_VIEWS} from '../src/art-rig-data.js';
import {MOVES} from '../src/combat.js';
import {gaitSettings} from '../src/locomotion.js';
const $=id=>document.getElementById(id),canvas=$('render'),source=$('source'),ctx=source.getContext('2d');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x242627);
const camera=new THREE.OrthographicCamera(-2,2,2,-2,.1,20);camera.position.set(0,1.55,10);camera.lookAt(0,1.55,0);camera.layers.enable(1);camera.layers.enable(2);
const characters=new Map(['player','boss'].map(type=>{const w=new ArtWarrior(type);scene.add(w.root,w.trailMesh);return [type,w];}));
const ground=new THREE.Group(),groundPoints=[-40,-.025,0,40,-.025,0];
for(let x=-40;x<=40;x+=.5)groundPoints.push(x,-.025,0,x,-.065,0);
const groundGeometry=new THREE.BufferGeometry();groundGeometry.setAttribute('position',new THREE.Float32BufferAttribute(groundPoints,3));
ground.add(new THREE.LineSegments(groundGeometry,new THREE.LineBasicMaterial({color:0x74776e,transparent:true,opacity:.55})));scene.add(ground);
let subject='player',view='front',state='reference',move='slash1',time=0,speed=7.4,playback=1,paused=false,last=performance.now();
let sourceImage=null;const images=new Map();
const a={type:'player',x:0,y:0,vx:0,vy:0,facing:-1,state:'reference',move:'slash1',t:0,phase:1,duration:.34};
function updateSource(){
  const d=ART_VIEWS[subject][view],url='../assets/reference/turnarounds/'+d.file+'.png';
  $('reference').href=url;$('file-name').textContent=d.file.toUpperCase();
  if(!images.has(url)){const img=new Image();img.onload=()=>{if(sourceImage===img)drawSource();};img.src=url;images.set(url,img);}
  sourceImage=images.get(url);drawSource();resize();
}
function drawSource(){
  if(!sourceImage?.complete||!sourceImage.naturalWidth)return;
  const d=ART_VIEWS[subject][view],ratio=Math.min(devicePixelRatio,2),w=source.clientWidth,h=source.clientHeight;
  source.width=Math.round(w*ratio);source.height=Math.round(h*ratio);ctx.setTransform(ratio,0,0,ratio,0,0);ctx.fillStyle='#242627';ctx.fillRect(0,0,w,h);
  const [l,t,r,b]=d.bounds,halfY=framing(),scale=h/(halfY*2*d.ppu),cx=w*.5,cy=h*.5+1.55*h/(halfY*2);
  ctx.drawImage(sourceImage,l,t,r-l,b-t,cx+(l-d.origin[0])*scale,cy+(t-d.origin[1])*scale,(r-l)*scale,(b-t)*scale);
}
function framing(){const aspect=canvas.clientWidth/canvas.clientHeight;return Math.max(1.87,(state==='reference'?1.06:2.95)/aspect);}
function resize(){
  const w=canvas.clientWidth,h=canvas.clientHeight,hy=framing();renderer.setSize(w,h,false);camera.left=-hy*w/h;camera.right=hy*w/h;camera.top=hy;camera.bottom=-hy;camera.updateProjectionMatrix();drawSource();
}
function pick(s,nextSpeed){state=s;time=0;if(nextSpeed)speed=Number(nextSpeed);document.querySelector('.views').classList.toggle('action',s!=='reference');if(s!=='reference'){view='side';$('view').value=view;updateSource();}document.querySelectorAll('[data-state]').forEach(b=>b.classList.toggle('on',b.dataset.state===s&&(!b.dataset.speed||Number(b.dataset.speed)===speed)));resize();}
$('subject').onchange=e=>{subject=e.target.value;updateSource();};
$('view').onchange=e=>{view=e.target.value;pick('reference');updateSource();};
document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>pick(b.dataset.state,b.dataset.speed));
$('playback').onchange=e=>{playback=Number(e.target.value);};
$('move').onchange=e=>{move=e.target.value;pick('attack');};
$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'继续':'定格';};
function seek(t){paused=true;$('pause').textContent='继续';time=t;}
$('time').oninput=e=>seek(Number(e.target.value)/1000);
$('impact').onclick=()=>{pick('attack');seek(MOVES[move].active);};
new ResizeObserver(resize).observe(canvas);
const ready=Promise.all([...characters.values()].map(w=>w.ready));
ready.then(()=>{$('loading').hidden=true;}).catch(e=>{$('loading').hidden=true;$('error').hidden=false;$('error').textContent=e.message;console.error(e);});
Object.defineProperty(window,'inkStudy',{get:()=>({subject,view,state,move,time:a.t,paused,loaded:characters.get(subject).loaded,
  speed,playback,gait:characters.get(subject).locomotion,legs:characters.get(subject).legPoses,
  source:ART_VIEWS[subject][view].file,renderer:'original-rgb-layered-mesh',parts:characters.get(subject).pieces.length,
  characters:[...characters].map(([type,w])=>({type,visible:w.root.visible,loaded:w.loaded,tip:w.tip.toArray(),base:w.base.toArray(),finite:[...w.tip,...w.base].every(Number.isFinite)}))})});
updateSource();
if(location.hash==='#run')pick('run',7.4);
function frame(now){
  requestAnimationFrame(frame);const dt=paused?0:Math.min(.035,Math.max(0,(now-last)/1000))*playback;last=now;time+=dt;
  const duration=state==='run'?gaitSettings(speed).stride/speed:MOVES[move].duration;
  const actionTime=state==='attack'?(paused?time:time%(duration+.40)):state==='run'?time%duration:time%1;
  $('time').max=state==='run'?Math.round(duration*1000):1000;
  Object.assign(a,{type:subject,state,move,t:state==='attack'?Math.min(duration,actionTime):actionTime,x:state==='run'?-time*speed:0,vx:state==='run'?-speed:0,duration,y:state==='jump'||state==='attack'&&['air','dive'].includes(move)?.22:0});
  if(state==='run')a.gaitPhase=time/duration;else delete a.gaitPhase;
  for(const [type,w]of characters){if(type===subject){w.setView(view);w.update(a,time,dt);}w.root.visible=type===subject;w.trailMesh.visible=w.trailMesh.visible&&type===subject;}
  if(!paused)$('time').value=Math.round(actionTime*1000);$('ms').textContent=Math.round(actionTime*1000)+' ms';
  $('timing').textContent=state==='attack'?(actionTime<MOVES[move].active?'蓄势':actionTime<=MOVES[move].end?'命中':'收势'):state==='reference'?'原画立姿':state==='run'?`${Math.round(actionTime/duration*100)}% 步态`:'动作检视';
  ground.visible=state!=='reference';ground.position.x=Math.floor(a.x);
  camera.position.x=a.x;camera.lookAt(a.x,1.55,0);
  renderer.render(scene,camera);
}requestAnimationFrame(frame);
</script></body></html>
